name: Matchbox
options:
  bundleIdPrefix: com.naveen
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    # No App Sandbox on purpose: reading the system trackpad preferences
    # (com.apple.AppleMultitouchTrackpad) is not permitted from a sandboxed app.
    ENABLE_APP_SANDBOX: NO
targets:
  Matchbox:
    type: application
    platform: macOS
    sources:
      - path: Matchbox
    settings:
      base:
        PRODUCT_NAME: Matchbox
        PRODUCT_BUNDLE_IDENTIFIER: com.naveen.Matchbox
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - MatchboxTests
  MatchboxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MatchboxTests
    dependencies:
      - target: Matchbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naveen.MatchboxTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Matchbox.app/Contents/MacOS/Matchbox
        BUNDLE_LOADER: $(TEST_HOST)
