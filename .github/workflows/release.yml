name: Release

# Push a tag like v0.2.0 and this builds Matchbox-0.2.0.zip and attaches it to
# a GitHub release of the same name. The latest one is always at
# https://github.com/naveen/matchbox/releases/latest
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number is the commit count

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Build and zip
        run: scripts/release.sh "${GITHUB_REF_NAME}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/Matchbox-$VERSION.zip" \
            --title "Matchbox $VERSION" \
            --generate-notes
